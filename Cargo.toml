[workspace]
resolver = "2"
members = [
    "apps/prismview-studio/src-tauri",
    "crates/prism-core",
    "crates/prismview-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["PrismView"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
# Exigidas por prism-core / prismview-engine (membros via path dep).
# wgpu 24: o código usa TexelCopy* e Instance::new(&desc) (23.x não tem); request_device ainda recebe `trace`.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
thiserror = "1"
ttf-parser = "0.25"
lyon_path = "1.0"
lyon_tessellation = "1.0"
wgpu = "24"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Otimiza dependências pesadas (wgpu, wgpu-hal, glam, cosmic-text, glyphon) mesmo em `dev`,
# mantendo compilação incremental rápida dos nossos crates e derrubando CPU em dev em ~5-10×.
# Build de teste: só linha/arquivo nos erros (sem info completa de depuração), e nada nas
# dependências. Corta GBs de `target/debug` e `target/engine/debug`; backtrace continua com linha.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
