[workspace]
resolver = "2"
members = [
    "apps/prismview-studio/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["PrismView"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
