[package]
name = "prism-vstem-wasm"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "Alongamento vetorial por haste (prism-core::vstem) para o Estúdio, em WebAssembly (C ABI, sem wasm-bindgen)."

# Fora do workspace do app (alvo wasm32, lockfile próprio): compilar com
# `node apps/prismview-studio/scripts/build-vstem-wasm.mjs`.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ttf-parser = "0.25"
rustybuzz = "0.20"
i_overlay = "9.2.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
